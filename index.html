<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RideHub – Rent Bikes, Motorbikes, and Cars</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>RideHub</h1>
    <p>Explore Indonesia on two or four wheels – Ride, Discover, Repeat.</p>
  </header>

  <section class="map-container">
    <h2>Your Location</h2>
    <div id="map"></div>
  </section>

  <section class="categories">
    <h2>Choose a Rental</h2>
    <div class="category-list">
      <div class="card">Bike</div>
      <div class="card">Motorbike</div>
      <div class="card">Car</div>
    </div>
  </section>

  <section class="booking-form">
    <h2>Book Your Ride</h2>
    <form id="form">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="text" id="pickup" placeholder="Pickup Location" required />
      <button type="submit">Book Now</button>
    </form>
  </section>

  <a href="https://wa.me/6281234567890" class="whatsapp-button" target="_blank">Contact via WhatsApp</a>

  <footer>
    <p>&copy; 2025 RideHub. Travel made easy in Indonesia.</p>
  </footer>

  <script src="script.js"></script>
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
  </script>
</body>
</html>
